<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    body { font-family: sans-serif; padding: 15px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #3498db; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    button:disabled { background: #bdc3c7; }
  </style>
</head>
<body>
  <div class="form-group">
    <label>起始日期</label>
    <input type="date" id="startDate">
  </div>
  <div class="form-group">
    <label>結束日期</label>
    <input type="date" id="endDate">
  </div>
  <button id="btnSubmit" onclick="submitRange()">整理並貼至成績表</button>

  <script>
    function submitRange() {
      const start = document.getElementById('startDate').value;
      const end = document.getElementById('endDate').value;
      if (!start || !end) return alert("請選擇完整的日期區間！");

      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.innerText = "處理中...";

      google.script.run
        .withSuccessHandler(msg => {
          alert(msg);
          google.script.host.close();
        })
        .withFailureHandler(err => {
          alert("失敗：" + err.message);
          btn.disabled = false;
          btn.innerText = "整理並貼至成績表";
        })
        .generateWeeklyReportByRange(start, end);
    }
  </script>
</body>
</html>
